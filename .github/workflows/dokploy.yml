name: Dokploy Docker Build

on:
  push:
    branches: [master, main, canary, "fix/re-apply-database-migration-fix"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/dokploy

permissions:
  contents: read

jobs:
  docker:
    strategy:
      matrix:
        platform:
          - os: ubuntu-22.04
            architecture: amd64
          - os: ubuntu-24.04-arm
            architecture: arm64
    runs-on: ${{ matrix.platform.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Get image version
        id: image_version
        run: |
          VERSION=$(node -p "require('./apps/dokploy/package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
            suffix=-${{ matrix.platform.architecture }},onlatest=true
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}
            type=raw,value=${{ steps.image_version.outputs.version }},enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=canary,enable=${{ github.ref == 'refs/heads/canary' }}
            type=raw,value=feature,enable=${{ github.ref != 'refs/heads/master' && github.ref != 'refs/heads/main' && github.ref != 'refs/heads/canary' }}

      - name: Prepare env file
        run: |
          cp apps/dokploy/.env.production.example .env.production
          cp apps/dokploy/.env.production.example apps/dokploy/.env.production

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/${{ matrix.platform.architecture }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  combine-manifests:
    needs: [docker]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create and push manifests
        run: |
          if [ "$GITHUB_REF" = "refs/heads/master" ]; then
            TAG="latest"
            VERSION=$(node -p "require('./apps/dokploy/package.json').version" | sed 's/^v//')
            docker buildx imagetools create -t "${IMAGE_NAME}:${TAG}" \
              "${IMAGE_NAME}:${TAG}-amd64" \
              "${IMAGE_NAME}:${TAG}-arm64"
            docker buildx imagetools create -t "${IMAGE_NAME}:v${VERSION}" \
              "${IMAGE_NAME}:${TAG}-amd64" \
              "${IMAGE_NAME}:${TAG}-arm64"

          elif [ "$GITHUB_REF" = "refs/heads/main" ]; then
            VERSION=$(node -p "require('./apps/dokploy/package.json').version")
            TAG="$VERSION"
            docker buildx imagetools create -t "${IMAGE_NAME}:${VERSION}" \
              "${IMAGE_NAME}:${TAG}-amd64" \
              "${IMAGE_NAME}:${TAG}-arm64"

          elif [ "$GITHUB_REF" = "refs/heads/canary" ]; then
            TAG="canary"
            docker buildx imagetools create -t "${IMAGE_NAME}:${TAG}" \
              "${IMAGE_NAME}:${TAG}-amd64" \
              "${IMAGE_NAME}:${TAG}-arm64"

          else
            TAG="feature"
            docker buildx imagetools create -t "${IMAGE_NAME}:${TAG}" \
              "${IMAGE_NAME}:${TAG}-amd64" \
              "${IMAGE_NAME}:${TAG}-arm64"
          fi

  generate-release:
    needs: [combine-manifests]
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      npm_version: ${{ steps.get_version.outputs.npm_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Get version
        id: get_version
        run: |
          VERSION=$(node -p "require('./apps/dokploy/package.json').version" | sed 's/^v//')
          echo "version=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "npm_version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check if release already exists
        id: check_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          if gh release view "$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch install.sh
        env:
          RELEASE_VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          curl -fsSL https://raw.githubusercontent.com/Dokploy/website/main/apps/website/public/install.sh -o install.sh
          head -1 install.sh | grep -q '^#!' || { echo "Downloaded install.sh is not a shell script"; exit 1; }
          grep -q 'DOKPLOY_VERSION' install.sh || { echo "install.sh no longer supports DOKPLOY_VERSION pinning"; exit 1; }
          { head -1 install.sh; echo "DOKPLOY_VERSION=\"\${DOKPLOY_VERSION:-${RELEASE_VERSION}}\""; tail -n +2 install.sh; } > install-pinned.sh
          mv install-pinned.sh install.sh

      - name: Create Release
        if: steps.check_release.outputs.exists == 'false'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.get_version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.get_version.outputs.version }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: install.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sync-version:
    needs: [generate-release]
    # These steps push to Dokploy's MCP, CLI, and SDK repositories.
    if: github.repository == 'Dokploy/dokploy'
    runs-on: ubuntu-latest
    env:
      NPM_VERSION: ${{ needs.generate-release.outputs.npm_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6
        with:
          version: 10.22.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24.4.0
          cache: pnpm

      - name: Generate OpenAPI specification
        run: |
          pnpm install --frozen-lockfile
          pnpm generate:openapi

      - name: Sync version to MCP repository
        run: |
          git clone https://x-access-token:${{ secrets.DOCS_SYNC_TOKEN }}@github.com/dokploy/mcp.git /tmp/mcp-repo
          cd /tmp/mcp-repo

          jq --arg v "$NPM_VERSION" '.version = $v' package.json > package.json.tmp
          mv package.json.tmp package.json

          cp "$GITHUB_WORKSPACE/openapi.json" src/generated/openapi.json
          pnpm install
          pnpm run generate

          git config user.name "Dokploy Bot"
          git config user.email "bot@dokploy.com"
          git add -A
          git commit -m "chore: bump version to $NPM_VERSION" \
            -m "Source: $GITHUB_REPOSITORY@$GITHUB_SHA" \
            --allow-empty
          git push

          echo "✅ MCP repo synced to version $NPM_VERSION"

      - name: Sync version to CLI repository
        run: |
          git clone https://x-access-token:${{ secrets.DOCS_SYNC_TOKEN }}@github.com/dokploy/cli.git /tmp/cli-repo
          cd /tmp/cli-repo

          jq --arg v "$NPM_VERSION" '.version = $v' package.json > package.json.tmp
          mv package.json.tmp package.json

          cp "$GITHUB_WORKSPACE/openapi.json" ./openapi.json
          pnpm install
          pnpm run generate

          git config user.name "Dokploy Bot"
          git config user.email "bot@dokploy.com"
          git add -A
          git commit -m "chore: bump version to $NPM_VERSION" \
            -m "Source: $GITHUB_REPOSITORY@$GITHUB_SHA" \
            --allow-empty
          git push

          echo "✅ CLI repo synced to version $NPM_VERSION"

      - name: Sync version to SDK repository
        run: |
          git clone https://x-access-token:${{ secrets.DOCS_SYNC_TOKEN }}@github.com/dokploy/sdk.git /tmp/sdk-repo
          cd /tmp/sdk-repo

          jq --arg v "$NPM_VERSION" '.version = $v' package.json > package.json.tmp
          mv package.json.tmp package.json

          cp "$GITHUB_WORKSPACE/openapi.json" ./openapi.json
          pnpm install
          pnpm run generate

          git config user.name "Dokploy Bot"
          git config user.email "bot@dokploy.com"
          git add -A
          git commit -m "chore: bump version to $NPM_VERSION" \
            -m "Source: $GITHUB_REPOSITORY@$GITHUB_SHA" \
            --allow-empty
          git push

          echo "✅ SDK repo synced to version $NPM_VERSION"
